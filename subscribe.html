<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Subscribe &mdash; Civic Power Lab</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Short notes from the Civic Power Lab — new work, field dispatches, things we're reading.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,300..700;1,8..60,300..700&family=Work+Sans:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/shared.css?v=14">
<link rel="icon" type="image/x-icon" href="/assets/favicon.ico">
<link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/assets/favicon-16.png">
<link rel="apple-touch-icon" sizes="180x180" href="/assets/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">
<meta name="theme-color" content="#0d3d45">
<style>
  .sub-wrap {
    min-height: 70vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 80px 20px;
  }
  .sub-card {
    max-width: 540px;
    width: 100%;
    text-align: center;
  }
  .sub-card .logo {
    width: 96px;
    height: 96px;
    margin: 0 auto 32px;
    display: block;
  }
  .sub-card .eyebrow {
    justify-content: center;
    margin-bottom: 18px;
  }
  .sub-card h1 {
    font-size: clamp(36px, 5vw, 56px);
    line-height: 1.05;
    margin-bottom: 24px;
  }
  .sub-card p {
    font-family: var(--font-display);
    font-size: 18px;
    line-height: 1.55;
    color: var(--ink-2);
    max-width: 44ch;
    margin: 0 auto 32px;
  }
  .sub-form {
    display: grid;
    gap: 12px;
    max-width: 420px;
    margin: 0 auto;
  }
  .sub-form input[type="email"],
  .sub-form input[type="text"] {
    width: 100%;
    background: var(--paper);
    border: 1px solid var(--rule);
    padding: 14px 16px;
    font-family: var(--font-body);
    font-size: 16px;
    color: var(--ink);
    border-radius: 0;
    transition: border-color .15s, background .15s;
  }
  .sub-form input:focus {
    outline: none;
    border-color: var(--cobalt);
    background: #fff;
  }
  .sub-form button {
    background: var(--cobalt-deep);
    color: var(--cream);
    border: 1px solid var(--cobalt-deep);
    padding: 14px 24px;
    font-family: var(--font-mono);
    font-size: 12px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    cursor: pointer;
    transition: background .15s, color .15s;
  }
  .sub-form button:hover { background: var(--terracotta); border-color: var(--terracotta); }
  .sub-fine {
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--mute);
    margin-top: 24px;
  }
</style>
</head>
<body>

<div data-nav></div>

<section class="sub-wrap">
  <div class="sub-card">
    <div class="eyebrow">Newsletter</div>
    <h1>Short notes from the Lab.</h1>
    <p>
      New work, field dispatches, and things we're reading. Easy to leave any
      time.
    </p>
    <form class="sub-form"
          name="cpl-mailing-list"
          method="POST"
          data-netlify="true"
          data-netlify-honeypot="bot-field"
          action="/thanks?type=list">
      <input type="hidden" name="form-name" value="cpl-mailing-list">
      <p style="display:none;"><label>Don&rsquo;t fill this out: <input name="bot-field"></label></p>
      <input type="text" name="your-name" placeholder="Your name (optional)">
      <input type="text" name="email" placeholder="Your email" required>
      <button type="submit">Subscribe</button>
    </form>
    <div class="sub-fine">civicpowerlab.us &middot; Harvard Kennedy School</div>
  </div>
</section>

<div data-footer></div>

<script src="assets/tiles.js?v=16"></script>
<script src="assets/chrome.js?v=16"></script>
<script>
  document.documentElement.classList.add('scheme-jewel');
</script>
</body>
</html>
