name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'organized/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # enablement: true turns on Pages (source: GitHub Actions) if it is off,
      # so no manual toggle in repo settings is needed.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: organized

      - id: deployment
        uses: actions/deploy-pages@v4
