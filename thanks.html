<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Thanks &mdash; Civic Power Lab</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,300..700;1,8..60,300..700&family=Work+Sans:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/shared.css?v=20">
<style>
  html { scheme-jewel: true; }
  .thanks-wrap {
    min-height: 70vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 80px 20px;
  }
  .thanks-card {
    max-width: 560px;
    text-align: center;
  }
  .thanks-card h1 {
    font-size: clamp(36px, 5vw, 56px);
    line-height: 1.05;
    margin-bottom: 24px;
  }
  .thanks-card p {
    font-family: var(--font-display);
    font-size: 18px;
    line-height: 1.55;
    color: var(--ink-2);
    max-width: 48ch;
    margin: 0 auto 32px;
  }
  .thanks-card .eyebrow {
    justify-content: center;
    margin-bottom: 18px;
  }
  .thanks-actions {
    display: inline-flex;
    gap: 16px;
    flex-wrap: wrap;
    justify-content: center;
  }
</style>
<link rel="icon" type="image/x-icon" href="/assets/favicon.ico">
<link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/assets/favicon-16.png">
<link rel="apple-touch-icon" sizes="180x180" href="/assets/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">
<meta name="theme-color" content="#0d3d45">
</head>
<body>

<div data-nav></div>

<section class="thanks-wrap">
  <div class="thanks-card">
    <div class="eyebrow" id="thanks-eyebrow">Received</div>
    <h1 id="thanks-headline">Thank you.</h1>
    <p id="thanks-body">
      We read every submission. In the meantime, feel free to keep exploring
      the lab.
    </p>
    <div class="thanks-actions">
      <a href="index.html" class="btn">Back to the lab &rarr;</a>
      <a href="research.html" class="btn ghost">See our research</a>
    </div>
  </div>
</section>

<div data-footer></div>

<script>
  document.documentElement.classList.add('scheme-jewel');
  // Customize copy by form type via ?type= query param
  (function() {
    const params = new URLSearchParams(window.location.search);
    const type = params.get('type');
    const variants = {
      partner: {
        eyebrow: 'Spec received',
        headline: 'Thank you.',
        body: "We read every submission."
      },
      ra: {
        eyebrow: 'Interest logged',
        headline: 'Thank you.',
        body: "We read every application carefully. We'll reach out when the next round opens, or sooner if your fit jumps out."
      },
      list: {
        eyebrow: 'Subscribed',
        headline: "You're on the list.",
        body: "Short notes from the lab. Easy to leave any time."
      }
    };
    const v = variants[type];
    if (v) {
      document.getElementById('thanks-eyebrow').textContent = v.eyebrow;
      document.getElementById('thanks-headline').textContent = v.headline;
      document.getElementById('thanks-body').textContent = v.body;
    }
  })();
</script>
<script src="assets/tiles.js?v=17"></script>
<script src="assets/chrome.js?v=17"></script>
</body>
</html>
